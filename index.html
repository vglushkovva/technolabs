<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Портфель решений</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: интерактивная презентация на весь экран — обложка → кто мы → направления → раздел с продуктами */
:root{
  --bg:#F3F2ED; --card:#FBFAF6; --ink:#14181B; --muted:#4F5961; --line:#D9DBD4;
  --dark:#14181B; --dark-2:#1F252A; --on-dark:#F3F2ED; --on-dark-muted:#A9B3BC;
  --accent:#F2B300; --accent-ink:#14181B; --accent-text:#8A6A00;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --card:#1A1F23; --ink:#ECEDE8; --muted:#A3ADB5; --line:#2C3338;
  --dark:#0B0D0F; --dark-2:#1A1F23; --accent-text:#F2B300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --card:#1A1F23; --ink:#ECEDE8; --muted:#A3ADB5; --line:#2C3338;
  --dark:#0B0D0F; --dark-2:#1A1F23; --accent-text:#F2B300; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;margin:0}
.screen{min-height:100%;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column}
.inner{width:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:28px;flex:1}
.dark{background:var(--dark);color:var(--on-dark)}
.dark .muted{color:var(--on-dark-muted)}
.muted{color:var(--muted)}
.back{font:600 22px var(--f-body);width:44px;height:44px;border-radius:999px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px}
.brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.btn{font:600 16px var(--f-body);border-radius:999px;padding:12px 22px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;padding-inline:10px;opacity:.8}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent-text)}
.dark .eyebrow{color:var(--accent)}
h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,7vw,96px)}
h2{font-size:clamp(30px,4.4vw,58px)}
h3{font-size:21px;margin:0;line-height:1.25}
p{margin:0}
.lead{font-size:clamp(18px,2vw,24px);max-width:56ch}
.grow{flex:1}
.cflow{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;counter-reset:cf}
.cflow li{counter-increment:cf;border:1.5px solid var(--on-dark-muted);color:var(--on-dark);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.cflow li::before{content:counter(cf) " · ";color:var(--accent)}
.stripe{position:fixed;left:0;top:0;bottom:0;width:10px;background:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;justify-content:space-between;min-height:220px;padding:24px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
.tile .num{font-family:var(--f-display);font-size:15px;color:var(--accent-text)}
.tile h3{font-family:var(--f-display);font-weight:500}
.tile p{font-size:15px;color:var(--muted)}
.tile .go{font-weight:600;font-size:15px}
.tile .tt{display:flex;flex-direction:column;gap:10px}.tile .tw{font-size:17px;line-height:1.4;color:var(--ink)}
.tile .tags{margin-top:6px}.tile{gap:24px}@media (max-width:640px){.tile{min-height:0}}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}.tags li{font-size:13px;line-height:1;padding:7px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tile.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.accent p,.tile.accent .num{color:var(--accent-ink)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-3px);border-color:var(--ink)}}

.sec-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:end}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}}
.does{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.does li{padding-left:22px;position:relative}
.does li::before{content:"";position:absolute;left:0;top:.6em;width:10px;height:10px;background:var(--accent);border-radius:2px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:stretch}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.prod p{font-size:16px;color:var(--muted)}
.prod .pname{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.prod .val{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.2;color:var(--ink);text-wrap:balance}
.prod.key .pname{color:var(--on-dark-muted)}
.prod.key .val{color:var(--accent)}
.prod .fig{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;gap:16px;flex-wrap:wrap}
.prod .fig div{display:flex;flex-direction:column;min-width:0}
.prod .fig strong{font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--accent-text)}
.prod .fig span{font-size:13px;color:var(--muted);max-width:20ch}
.prod.key{background:var(--dark-2);color:var(--on-dark);border-color:var(--dark-2)}
.prod.key p,.prod.key .fig span{color:var(--on-dark-muted)}
.prod.key .fig strong{color:var(--accent)}
.prod.key .fig{border-color:#3A434A}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.map{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.marr{align-self:center;font-size:24px;color:var(--muted)}
.node{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.node .nt{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.node .loss{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.how{flex-basis:100%;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent-text);padding-top:10px;border-top:1px dashed var(--line)}
.nfig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nfig div{display:flex;flex-direction:column;gap:2px;min-width:0}
.nfig b{font-family:var(--f-display);font-size:20px;line-height:1.1;color:var(--accent-text)}
.nfig span{font-size:12.5px;line-height:1.3;color:var(--muted)}
.zones{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.6fr);gap:16px;align-items:stretch}
.zstack{display:grid}.zstack>.zpanel{grid-area:1/1}.zstack>.zpanel:not(.on){visibility:hidden}
.zlist .zbtn{flex:1}
.zlist{display:flex;flex-direction:column;gap:8px}
.zbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.zbtn .zn{font-family:var(--f-display);font-size:14px;color:var(--muted)}
.zbtn .zt{flex:1;font-family:var(--f-display);font-weight:600;font-size:20px}
.zbtn .zar{opacity:.4}
.zbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zbtn.on .zn,.zbtn.on .zar{color:var(--accent);opacity:1}
.zbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.zpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.zloss{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.4vw,30px);line-height:1.2}
.zpanel .nfig b{font-size:26px}
.zpanel .nfig span{font-size:14px}
@media (max-width:760px){.zones{grid-template-columns:1fr}.zlist{flex-direction:row;overflow-x:auto}.zbtn{padding:12px 14px;flex:none}.zbtn .zt{font-size:16px}.zbtn .zar{display:none}}
.ucards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.uc{all:unset;cursor:pointer;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.uc .pname{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.uc .uv{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25}
.uc .uf{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.uc .uf b{font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--accent-text)}
.uc .uf span{font-size:13px;color:var(--muted)}
.uc .ugo{font-weight:600;font-size:14px;margin-top:auto}
.uc.key{background:var(--dark-2);color:var(--on-dark);border-color:var(--dark-2)}
.uc.key .pname,.uc.key .uf span{color:var(--on-dark-muted)}.uc.key .uf b{color:var(--accent)}.uc.key .uf{border-color:#3A434A}
.uc:focus-visible,.digbar:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.uc{transition:transform .15s,border-color .15s}.uc:hover{transform:translateY(-3px);border-color:var(--ink)}}
.digbar{all:unset;cursor:pointer;box-sizing:border-box;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;font-weight:600;font-size:17px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.gc h3{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.15}
.gf{display:flex;flex-direction:column;gap:2px}.gf b{font-family:var(--f-display);font-size:30px;line-height:1.05;color:var(--accent-text)}.gf span{font-size:13.5px;color:var(--muted)}
.gps{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.gps .how{padding-top:12px}
.gchip{all:unset;cursor:pointer;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.gchip:hover{background:var(--ink);color:var(--bg)}
.gchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gc.key{background:var(--dark-2);color:var(--on-dark);border-color:var(--dark-2)}
.gc.key .gf b,.gc.key .how{color:var(--accent)}.gc.key .gf span{color:var(--on-dark-muted)}.gc.key .how{border-color:#3A434A}
.gc.key .gchip{border-color:var(--on-dark-muted)}.gc.key .gchip:hover{background:var(--on-dark);color:var(--dark-2)}
.blk{scroll-snap-align:start}
.blk>.screen{min-height:100vh;min-height:100svh;justify-content:center}
@media (min-width:900px) and (min-height:640px){html{scroll-snap-type:y proximity}}
.down{font-weight:600;color:var(--accent)}
.bars2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar2{all:unset;cursor:pointer;box-sizing:border-box;border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.bar2 h3{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.2}
.bar2 .ugo{font-weight:600;font-size:15px;margin-top:6px}
.bar2.y{background:var(--accent);color:var(--accent-ink)}
.bar2.d{background:var(--dark-2);color:var(--on-dark)}.bar2.d span:not(.ugo){color:var(--on-dark-muted)}.bar2.d .ugo{color:var(--accent)}
.bar2:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bar2 .ugo{display:inline-block}
@media (prefers-reduced-motion:no-preference){.bar2{transition:transform .15s,box-shadow .15s,filter .15s}.bar2 .ugo{transition:transform .15s}.bar2:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.10)}.bar2.y:hover{filter:brightness(1.04)}.bar2.d:hover{border-color:var(--ink)}.bar2:hover .ugo{transform:translateX(4px)}}
.land{--fd:var(--f-display);--fb:var(--f-body);--mut:var(--muted);--dk:var(--dark);--dk2:var(--dark-2);--ondk:var(--on-dark);--ondkm:var(--on-dark-muted);--acc:var(--accent);--acct:var(--accent-text);--ok:#2f6f4e;font:17px/1.5 var(--f-body);color:var(--ink);background:var(--bg);border-radius:16px;overflow:hidden}
.mbox.wide{width:min(980px,100%)}
.land .Lblk{padding:36px clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:18px}
.land .Lblk+.Lblk{border-top:1px solid var(--line)}
.land .Lhero{background:var(--dk2);color:var(--ondk)}
.land .Leb{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--acct)}
.land .Lhero .Leb{color:var(--acc)}
.land h1,.land h2{font-family:var(--fd);font-weight:700;line-height:1.08;margin:0;text-wrap:balance}
.land h1{font-size:clamp(30px,4.6vw,50px)}
.land h2{font-size:clamp(22px,2.8vw,30px)}
.land h3{margin:0;font-size:18px;line-height:1.25}
.land p{margin:0}
.land .Llead{font-size:clamp(17px,1.8vw,20px);color:var(--ondkm);max-width:60ch}
.land .Lstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.land .Lstat{border-top:1px solid #3A434A;padding-top:12px}
.land .Lstat b{display:block;font-family:var(--fd);font-size:28px;color:var(--acc);line-height:1.1}
.land .Lstat span{font-size:13.5px;color:var(--ondkm)}
.land .Lcta{display:flex;gap:10px;flex-wrap:wrap}
.land .Lbtn{font:600 16px var(--fb);border-radius:999px;padding:12px 22px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.land .Lbtn.Ly{background:var(--acc);border-color:var(--acc);color:#14181B}
.land .Lwho{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.land .Lwc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.land .Lwc p{color:var(--mut);font-size:15px}
.land .Lfeats{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.land .Lf{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.land .Lf .Ln{font-family:var(--fd);color:var(--acct);font-size:15px;min-width:24px}
.land .Lf p{color:var(--mut);font-size:15px;margin-top:4px}
.land table{width:100%;border-collapse:collapse;font-size:15px}
.land th,.land td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.land th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.land td:nth-child(2){font-weight:600}
.land td:nth-child(2)::before{content:"✓ ";color:var(--ok)}
.land td:nth-child(3){color:var(--mut)}
.land .Ltw{overflow-x:auto}
.land .Lsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.land .Lst{border-top:4px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.land .Lst.Lhl{border-color:var(--acc)}
.land .Lst b{font-family:var(--fd);color:var(--acct);font-size:15px}
.land .Lst p{color:var(--mut);font-size:15px}
.land .Llic{display:flex;gap:12px;flex-wrap:wrap}
.land .Lpill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex:1;min-width:220px}
.land .Lpill p{color:var(--mut);font-size:14.5px;margin-top:4px}
.land .Lquiet{background:var(--acc);color:#14181B;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.land .Lend{background:var(--dk2);color:var(--ondk)}
.land .Lend .Llead{color:var(--ondkm)}
.land .Lnote{font-size:12.5px;color:var(--mut)}
.land .Lflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.land .Lfl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.land .Lfl b{font-family:var(--fd);color:var(--acct);font-size:14px}
.land .Lfl p{color:var(--mut);font-size:14px}
.land .Lpain{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.land .Lpc{border-top:4px solid #c0392b;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.land .Lpc p{color:var(--mut);font-size:15px}
.land .Lbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.land .Lbig div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.land .Lbig b{display:block;font-family:var(--fd);font-size:26px;color:var(--acct);line-height:1.1}
.land .Lbig span{font-size:13.5px;color:var(--mut)}
.land .Lflow{grid-template-columns:1fr}
@media (max-width:820px){.land .Lflow{grid-template-columns:1fr}}
.land .Lrisk{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.land .Lrisk{grid-template-columns:1fr}}
.mnote{font-size:12.5px;color:var(--muted);max-width:110ch}
.pchip{font:600 13px var(--f-body);border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;text-align:left}
.pchip:hover{background:var(--ink);color:var(--bg)}
.pchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pts{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.pts li{position:relative;padding-left:24px;font-size:16px;line-height:1.4}
.pts li::before{content:"";position:absolute;left:2px;top:.38em;width:12px;height:7px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.mbox .fig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 28px;padding-top:16px}
.mbox .fig span{max-width:none;font-size:14px;line-height:1.4;margin-top:4px}
.pact{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.pbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:500;text-decoration:none;cursor:pointer}
.pbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbtn:hover{opacity:.85}
